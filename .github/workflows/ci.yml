name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck
        name: TypeScript check

      - run: npm run lint
        name: ESLint

      - run: npm run test
        name: Vitest

      - run: npm run build
        name: Next.js build
